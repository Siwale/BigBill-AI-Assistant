name: bigbill-assistant

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: bigbill-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant_local_dev
      POSTGRES_DB: assistant
    ports:
      - "5437:5432"
    volumes:
      - assistant_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: bigbill-assistant-redis
    restart: unless-stopped
    ports:
      - "6384:6379"
    volumes:
      - assistant_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  assistant_pgdata:
  assistant_redisdata:
